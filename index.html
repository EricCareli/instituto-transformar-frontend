<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Instituto Transformar - educação, esporte e inclusão social.">
  <title>Instituto Transformar</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <a class="skip-link" href="#app">Pular para o conteúdo principal</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#inicio" aria-label="Instituto Transformar - página inicial">
        Instituto Transformar
      </a>

      <button
        id="menuToggle"
        class="menu-toggle"
        type="button"
        aria-label="Abrir menu de navegação"
        aria-expanded="false"
        aria-controls="mainNav">
        ☰
      </button>

      <nav id="mainNav" class="main-nav" aria-label="Navegação principal">
        <a href="#inicio">Início</a>
        <a href="#projetos">Projetos</a>
        <a href="#cadastro">Cadastre-se</a>
        <button id="contrastToggle" class="link-button" type="button" aria-pressed="false">
          Alto contraste
        </button>
      </nav>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Instituto Transformar. Projeto acadêmico.</p>
    </div>
  </footer>

  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <div id="modalBackdrop" class="modal-backdrop" hidden>
    <section
      id="infoModal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
      aria-describedby="modalDescription">
      <button id="modalClose" class="modal-close" type="button" aria-label="Fechar modal">×</button>
      <h2 id="modalTitle">Seja um voluntário</h2>
      <p id="modalDescription">
        Seu tempo e talento podem transformar vidas. Cadastre-se e participe dos projetos do Instituto Transformar.
      </p>
      <a class="button primary" href="#cadastro">Quero me cadastrar</a>
    </section>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
